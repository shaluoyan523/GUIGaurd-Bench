[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounding-eval"
version = "0.1.0"
description = "ScreenSpot-style GUI grounding evaluation for click-point prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "openai>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
grounding-eval = "grounding_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grounding_eval*"]
